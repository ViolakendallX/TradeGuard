<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="An AI-powered trading decision desk that challenges, researches, and stress-tests your trade thesis before you risk capital."
    />
    <meta name="theme-color" content="#050914" />

    <!--
      The three families of the type system.

      Space Grotesk — headings and every number that has to feel engineered.
      Inter        — all reading text.
      JetBrains Mono — money, risk and any figure a trader scans vertically.

      Loaded with `display=swap` so the first paint is never blocked by a font;
      every rule that uses them also declares a real fallback stack, so the
      product is fully legible if these never arrive.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>TradeGuard — Stress-test your trade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
